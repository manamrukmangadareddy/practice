<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I Love You Priya</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }
    h1 {
      color: red;
      font-size: 3em;
    }
    input[type="text"] {
      padding: 10px;
      width: 300px;
      font-size: 1em;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 1em;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>I ❤️ YOU PRIYA</h1>
  <p>Enter your response below:</p>
  <input type="text" id="responseBox" placeholder="Type your reply here...">
  <br>
  <button onclick="showResponse()">Submit</button>

  <p id="output"></p>

  <script>
    function showResponse() {
      const response = document.getElementById("responseBox").value;
      document.getElementById("output").innerText = "You replied: " + response;
    }
  </script>
</body>
</html>
